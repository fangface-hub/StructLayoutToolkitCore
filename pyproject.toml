[project]
name = "sltcore"
version = "0.1.0"
description = "A toolkit for handling structured data layouts and bit-level operations."
readme = "README.md"
authors = [
    { name = "fangface" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sltcore"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
